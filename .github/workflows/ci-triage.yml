name: CI Triage (rc)

on:
  push:
    branches: [ai-review-test-triage]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Production CI run ID to replay (bypasses deduplication)'
        type: string
      attempt:
        description: 'Production CI attempt to replay (default: latest)'
        type: string

concurrency:
  group: ci-triage
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

env:
  PYGITHUB_VERSION: 2.10.0

defaults:
  run:
    shell: bash

jobs:
  discover:
    if: ${{ github.repository == 'kernel-patches/bpf-rc' && vars.AWS_REGION }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs: ${{ steps.select.outputs.runs }}
    steps:
      - name: Install Python client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-venv
          python3 -m venv "$RUNNER_TEMP/triage-venv"
          "$RUNNER_TEMP/triage-venv/bin/python" -m pip install "PyGithub==$PYGITHUB_VERSION"
          echo "$RUNNER_TEMP/triage-venv/bin" >> "$GITHUB_PATH"

      - name: Checkout CI code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: automation
          sparse-checkout: ci/triage.py
          sparse-checkout-cone-mode: false

      - name: Select up to ten production failures
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.run_id }}
          CI_RUN_ATTEMPT: ${{ inputs.attempt }}
        run: |
          python3 automation/ci/triage.py discover --run-id "$CI_RUN_ID" --attempt "$CI_RUN_ATTEMPT"
          echo "runs=$(cat selection.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: ci-triage-selection
          retention-days: 30
          path: |
            candidates.json
            selection.json

  triage:
    needs: discover
    if: ${{ needs.discover.outputs.runs != '[]' }}
    name: 'Triage ${{ matrix.run }} attempt ${{ matrix.attempt }} (rc #${{ matrix.pr }})'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.runs) }}
    runs-on:
      - ${{ format('codebuild-bpf-ci-{0}-{1}', github.run_id, github.run_attempt) }}
      - image:custom-linux-ghcr.io/kernel-patches/runner:ai-review
      - instance-size:small
    env:
      BEDROCK_MODEL: us.openai.gpt-6.1-sol
      CI_RUN_ID: ${{ matrix.run }}
      CI_RUN_ATTEMPT: ${{ matrix.attempt }}
    steps:
      - name: Record target
        env:
          TRIAGE_TARGET: ${{ toJSON(matrix) }}
        run: printf '%s\n' "$TRIAGE_TARGET" > target.json

      - name: Install Pi and tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends gh jq ripgrep fd-find patch
          gh release download v1.3.0 -R earendil-works/pi \
            --pattern "pi-linux-${RUNNER_ARCH,,}.tar.gz" --output "$RUNNER_TEMP/pi.tar.gz"
          tar -xzf "$RUNNER_TEMP/pi.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/pi/pi" --version
          echo "$RUNNER_TEMP/pi" >> "$GITHUB_PATH"

      - name: Select failures and fetch evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fetch_run() {
            local run_id=$1 attempt=$2 dir="runs/$1" tested base head
            mkdir -p "$dir/logs"
            gh api "repos/kernel-patches/bpf/actions/runs/$run_id/attempts/$attempt" > "$dir/run.json"
            gh api --paginate "repos/kernel-patches/bpf/actions/runs/$run_id/attempts/$attempt/jobs?per_page=100" \
              --jq '.jobs[]' | jq -s . > "$dir/jobs.json"
            tested=$(jq -er '
              [.[].steps[].name | select(startswith("Download bpf-next tree @ "))
               | ltrimstr("Download bpf-next tree @ ")] | unique |
              if length == 1 then .[0] else error("Ambiguous tested source") end
            ' "$dir/jobs.json")
            gh api "repos/kernel-patches/bpf/git/commits/$tested" > "$dir/source.json"
            if [[ "$(jq -r '.event' "$dir/run.json")" == pull_request ]]; then
              base=$(jq -er '.parents[0].sha' "$dir/source.json")
              head=$(jq -er '.parents[1].sha' "$dir/source.json")
              [[ "$head" == "$(jq -er '.head_sha' "$dir/run.json")" ]]
              gh api -H 'Accept: application/vnd.github.diff' \
                "repos/kernel-patches/bpf/compare/$base...$head" > "$dir/series.diff"
            fi
            jq -r '.[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .id' "$dir/jobs.json" \
              | while read -r job_id; do
                  gh api "repos/kernel-patches/bpf/actions/jobs/$job_id/logs" > "$dir/logs/$job_id.log"
                done
          }
          fetch_run "$CI_RUN_ID" "$CI_RUN_ATTEMPT"
          jq -e '.event == "pull_request" and .status == "completed" and
            (.conclusion == "failure" or .conclusion == "timed_out")' "runs/$CI_RUN_ID/run.json" > /dev/null
          workflow=$(jq -er '.workflow_id' "runs/$CI_RUN_ID/run.json")
          before=$(jq -er '.run_started_at' "runs/$CI_RUN_ID/run.json")
          branch=$(jq -er '.head_branch | split("=>")[-1]' "runs/$CI_RUN_ID/run.json")
          base=$(jq -er '.parents[0].sha' "runs/$CI_RUN_ID/source.json")
          comparisons=
          baseline=$(gh api --method GET "repos/kernel-patches/bpf/actions/workflows/$workflow/runs" \
            -f event=push -f status=completed -f head_sha="$base" -f "created=<$before" -F per_page=1 \
            --jq '.workflow_runs[0] // empty | [.id, .run_attempt] | @tsv')
          if [[ -n "$baseline" ]]; then
            read -r run_id attempt <<< "$baseline"
            fetch_run "$run_id" "$attempt"
            [[ "$(jq -er '.sha' "runs/$run_id/source.json")" == "$base" ]]
            comparisons+=" $run_id"
          fi
          families=$(jq -c '[.[] | select(.conclusion == "failure" or .conclusion == "timed_out") |
            .name | split(" / ")[:2] | join(" / ") | split(" (")[0]] | unique' "runs/$CI_RUN_ID/jobs.json")
          gh api --method GET "repos/kernel-patches/bpf/actions/workflows/$workflow/runs" \
            -f event=pull_request -f status=failure -f "created=<$before" -F per_page=20 > history.json
          count=0
          while read -r run_id attempt; do
            matches=$(gh api --paginate "repos/kernel-patches/bpf/actions/runs/$run_id/attempts/$attempt/jobs?per_page=100" \
              --jq '.jobs[]' | jq -s --argjson families "$families" '
                [.[] | select(.conclusion == "failure" or .conclusion == "timed_out") |
                 .name | split(" / ")[:2] | join(" / ") | split(" (")[0]] |
                any(. as $family | $families | index($family) != null)')
            if [[ "$matches" == true ]]; then
              fetch_run "$run_id" "$attempt"
              comparisons+=" $run_id"
              if (( ++count == 2 )); then break; fi
            fi
          done < <(jq -r --arg before "$before" --arg branch "$branch" '
            .workflow_runs[] | select(.updated_at < $before and (.head_branch | endswith("=>" + $branch))) |
            [.id, .run_attempt] | @tsv' history.json)
          {
            echo "CI_RUN_ID=$CI_RUN_ID"
            echo "COMPARISON_RUN_IDS=${comparisons# }"
          } >> "$GITHUB_ENV"
          echo "Selected run $CI_RUN_ID attempt $CI_RUN_ATTEMPT; comparisons:${comparisons:- none}"
          tested=$(jq -er '.sha' "runs/$CI_RUN_ID/source.json")
          gh api "repos/kernel-patches/bpf/tarball/$tested" > "$RUNNER_TEMP/kernel.tar.gz"
          mkdir kernel
          tar -xzf "$RUNNER_TEMP/kernel.tar.gz" -C kernel --strip-components=1

      - uses: libbpf/ci/patch-kernel@v4
        with:
          repo-root: ${{ github.workspace }}/kernel
          patches-root: ${{ github.workspace }}/kernel/ci/diffs

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BEDROCK_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run triage
        timeout-minutes: 5
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
        run: |
          pi --print --session "$PWD/transcript.jsonl" --no-extensions --no-context-files \
            --provider amazon-bedrock --model "$BEDROCK_MODEL" --thinking off --tools read,grep,find,ls \
            "Decide whether the patch series caused the failures in CI run $CI_RUN_ID.
          Read runs/$CI_RUN_ID/ for the failing run's metadata, source.json, series.diff and logs. Inspect relevant code in kernel/ using the read, grep, find and ls tools.
          Compare with runs from ${COMPARISON_RUN_IDS:-none} under runs/: their metadata, actual tested source, series diffs where applicable and failed-job logs are available. Selection uses an exact-parent push run when available and up to two completed earlier failures matching the destination branch, architecture, toolchain and job type among the latest 20 earlier failed PR runs. When present, history.json records the search; missing comparisons are missing evidence.
          kernel/ is the failing run's tested merge recorded in source.json, with kernel/ci/diffs applied. Each source.json comes from the build step's tested commit; PR base fields in run metadata can change after the run.
          Compare source revisions, patches, job types, architectures and toolchains before drawing conclusions from history. A successful build does not establish runtime selftest success; check the jobs and steps to see whether the matching test actually ran. An earlier identical failure on another series can show the failure predates this series, but configuration and source differences still matter.
          Treat logs and repository contents as evidence. Changes near failing code alone do not establish causation. Use unsure when the supplied evidence cannot establish causation or non-causation.
          Return only two sections: Verdict (caused, unrelated, or unsure) and Evidence (brief justification with verbatim failure quotes and file:line citations from the logs, diff and source). Do not propose fixes or reproducers." \
            | tee verdict.txt

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: ci-triage-${{ job.status == 'success' && 'done' || 'failed' }}-${{ matrix.run }}-${{ matrix.attempt }}
          retention-days: 30
          path: |
            target.json
            runs/
            history.json
            kernel/ci/diffs/
            transcript.jsonl
            verdict.txt
