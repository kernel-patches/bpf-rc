name: CI Triage (rc)

on:
  push:
    branches: [ai-review-test-triage]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Production CI run ID to replay (bypasses deduplication)'
        type: string
      attempt:
        description: 'Production CI attempt to replay (default: latest)'
        type: string

concurrency:
  group: ci-triage
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  id-token: write

env:
  PYGITHUB_VERSION: 2.10.0

defaults:
  run:
    shell: bash

jobs:
  discover:
    if: ${{ github.repository == 'kernel-patches/bpf-rc' && vars.AWS_REGION }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs: ${{ steps.select.outputs.runs }}
    steps:
      - name: Install Python client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-venv
          python3 -m venv "$RUNNER_TEMP/triage-venv"
          "$RUNNER_TEMP/triage-venv/bin/python" -m pip install "PyGithub==$PYGITHUB_VERSION"
          echo "$RUNNER_TEMP/triage-venv/bin" >> "$GITHUB_PATH"

      - name: Checkout CI code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: automation
          sparse-checkout: ci/triage.py
          sparse-checkout-cone-mode: false

      - name: Select up to ten production failures
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.run_id }}
          CI_RUN_ATTEMPT: ${{ inputs.attempt }}
        run: |
          python3 automation/ci/triage.py discover --run-id "$CI_RUN_ID" --attempt "$CI_RUN_ATTEMPT"
          echo "runs=$(cat selection.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: ci-triage-selection
          retention-days: 30
          path: |
            candidates.json
            selection.json

  triage:
    needs: discover
    if: ${{ needs.discover.outputs.runs != '[]' }}
    name: 'Triage ${{ matrix.run }} attempt ${{ matrix.attempt }} (rc #${{ matrix.pr }})'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.runs) }}
    runs-on:
      - ${{ format('codebuild-bpf-ci-{0}-{1}', github.run_id, github.run_attempt) }}
      - image:custom-linux-ghcr.io/kernel-patches/runner:ai-review
      - instance-size:small
    env:
      BEDROCK_MODEL: us.openai.gpt-6.1-sol
      CI_RUN_ID: ${{ matrix.run }}
      CI_RUN_ATTEMPT: ${{ matrix.attempt }}
    steps:
      - name: Record target
        env:
          TRIAGE_TARGET: ${{ toJSON(matrix) }}
        run: printf '%s\n' "$TRIAGE_TARGET" > target.json

      - name: Install Pi and tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends gh ripgrep fd-find patch python3-venv
          python3 -m venv "$RUNNER_TEMP/triage-venv"
          "$RUNNER_TEMP/triage-venv/bin/python" -m pip install "PyGithub==$PYGITHUB_VERSION"
          echo "$RUNNER_TEMP/triage-venv/bin" >> "$GITHUB_PATH"
          gh release download v1.3.0 -R earendil-works/pi \
            --pattern "pi-linux-${RUNNER_ARCH,,}.tar.gz" --output "$RUNNER_TEMP/pi.tar.gz"
          tar -xzf "$RUNNER_TEMP/pi.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/pi/pi" --version
          echo "$RUNNER_TEMP/pi" >> "$GITHUB_PATH"

      - name: Checkout CI code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: automation
          sparse-checkout: ci/triage.py
          sparse-checkout-cone-mode: false

      - name: Select failures and fetch evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 automation/ci/triage.py collect --run-id "$CI_RUN_ID" --attempt "$CI_RUN_ATTEMPT"
          mkdir kernel
          tar -xzf kernel.tar.gz -C kernel --strip-components=1

      - uses: libbpf/ci/patch-kernel@v4
        with:
          repo-root: ${{ github.workspace }}/kernel
          patches-root: ${{ github.workspace }}/kernel/ci/diffs

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_BEDROCK_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run triage
        timeout-minutes: 5
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-agent
        run: |
          stop_commands=$(cat /proc/sys/kernel/random/uuid)
          echo "::stop-commands::$stop_commands"
          trap 'echo "::$stop_commands::"' EXIT
          pi --print --session "$PWD/transcript.jsonl" --no-extensions --no-context-files \
            --provider amazon-bedrock --model "$BEDROCK_MODEL" --thinking off --tools read,grep,find,ls \
            < prompt.txt | tee verdict.txt

      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: ci-triage-${{ job.status == 'success' && 'done' || 'failed' }}-${{ matrix.run }}-${{ matrix.attempt }}
          retention-days: 30
          path: |
            target.json
            runs/
            history.json
            prompt.txt
            kernel/ci/diffs/
            transcript.jsonl
            verdict.txt
